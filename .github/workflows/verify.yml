name: Verify Windhawk source bundle

on:
  push:
  pull_request:

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout with integrations
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle source
        run: python scripts/build.py
      - name: Check integrated behavior
        run: python scripts/test_features.py
      - name: Test Discord notification avatars and voice state
        shell: pwsh
        run: |
          python integrations/discord/agent/test_notification_avatar.py
          python integrations/discord/agent/test_voice_state.py
          python integrations/discord/agent/test_controller.py
      - name: Test browser artwork and Native Messaging
        shell: pwsh
        run: |
          node integrations/browser-media/tests/test_artwork.js
          node integrations/browser-media/extension/test_background_art.cjs
          node integrations/browser-media/extension/test_page_art.cjs
          python integrations/browser-media/windhawk/test_native_host.py
      - name: Install preview renderer
        run: python -m pip install Pillow==12.3.0
      - name: Render all synthetic dashboard previews
        run: python scripts/render_previews.py
      - name: Validate preview coverage and FPS cadence
        run: python tests/test_previews.py
      - name: Upload synthetic preview gallery
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-island-previews
          path: previews/*.png
          retention-days: 30
      - name: Verify generated bundle
        shell: pwsh
        run: |
          $f = Get-Content dist/mod.wh.cpp -Raw
          if ($f -notmatch 'DIDiscordIsolatedAudioLevel') { throw 'Discord audio bridge missing' }
          if ($f -notmatch 'TryReadBrowserBridgeSnapshot') { throw 'Browser media bridge missing' }
          if ($f -match '#include "\.\./integrations/') { throw 'Unresolved submodule include' }
          Write-Output 'Bundle verification passed'
