name: Publish synthetic UI previews

on:
  push:
    branches: [main]
    paths:
      - 'src/mod.wh.cpp'
      - 'scripts/render_previews.py'
      - 'tests/test_previews.py'
      - '.github/workflows/render-previews.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: island-synthetic-previews-main
  cancel-in-progress: false

jobs:
  previews:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact preview renderer version
        run: python -m pip install Pillow==12.3.0
      - name: Render all modules using synthetic data
        run: python scripts/render_previews.py
      - name: Verify complete and referenced preview set
        run: python tests/test_previews.py
      - name: Upload ready-to-view PNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-island-previews
          path: previews/*.png
          retention-days: 90
      - name: Publish updated previews to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- previews/
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "All preview PNGs are already up to date."
            exit 0
          }
          git commit -m "chore: regenerate synthetic island previews [skip ci]"
          if ($LASTEXITCODE -ne 0) { throw "Preview commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Preview publish failed; artifact is available." }
